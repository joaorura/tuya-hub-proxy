name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Fetch tuya-local for the integration test (3.14 only)
        if: matrix.python-version == '3.14'
        run: |
          git clone --depth 1 https://github.com/make-all/tuya-local.git "$RUNNER_TEMP/tuya-local"
          echo "TUYA_LOCAL_PATH=$RUNNER_TEMP/tuya-local" >> "$GITHUB_ENV"
      - name: Test
        run: python -m pytest -v
